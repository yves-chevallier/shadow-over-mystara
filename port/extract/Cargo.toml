[package]
name = "extract"
version = "0.1.0"
edition = "2021"
description = "Extracts the ddsom resources (graphics, palettes, sounds, sprites, scenery) from the user's ROMs"

[dependencies]
cps2-gfx = { path = "../cps2-gfx" }
cps2 = { path = "../cps2", default-features = false }
ddsom-assets = { path = "../ddsom-assets" }
ddsom-data = { path = "../ddsom-data" }
ddsom-sound = { path = "../ddsom-sound" }
qsound = { path = "../qsound" }
png = "0.17"
# The 68000 decoder, for the `remainder` category only (the program): the library (`to_data`) has no 68000.
m68k = { path = "../m68k", optional = true }

[features]
default = ["full"]
full = ["dep:m68k"]

[[bin]]
name = "extract"
required-features = ["full"]
