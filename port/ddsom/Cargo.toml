[package]
name = "ddsom"
version = "0.1.0"
edition = "2021"
description = "Dungeons & Dragons: Shadow over Mystara — playable Rust port"

[dependencies]
cps2 = { path = "../cps2", default-features = false }
# The CPS2 renderer: draws the frames of the game (`ddsom_game::Game::frame`).
cps2-gfx = { path = "../cps2-gfx" }
# The original code (diagnostics DDSOM_ORIGINE / DDSOM_INTERP, feature `original`): the game itself has no 68000.
ddsom-rc = { path = "../ddsom-rc", optional = true }
ddsom-game = { path = "../ddsom-game", default-features = false }
# The game data of the mode with ROMs, extracted in memory (without the 68000 decoder of the `extract` program).
extract = { path = "../extract", default-features = false }
# The window, the keyboard, the frame texture and its filters (L21 facade).
macroquad = { version = "0.4.16", default-features = false }

[features]
# `cargo run -p ddsom --features original`: the original code on the emulated 68000 (DDSOM_ORIGINE=1, DDSOM_INTERP=1).
original = ["dep:ddsom-rc", "cps2/m68k"]

# Sound output (PulseAudio, waveOut: libraries loaded at run time) and gamepads (gilrs); none on the web.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = "0.8"
gilrs = "0.11.2"
