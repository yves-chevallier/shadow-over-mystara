[package]
name = "ddsom"
version = "0.1.0"
edition = "2021"
description = "Dungeons & Dragons: Shadow over Mystara — port Rust jouable"

[dependencies]
cps2 = { path = "../cps2" }
ddsom-rc = { path = "../ddsom-rc" }
ddsom-game = { path = "../ddsom-game" }
ddsom-assets = { path = "../ddsom-assets" }
libloading = "0.8"
qsound = { path = "../qsound" }

[target.'cfg(unix)'.dependencies]
minifb = { version = "0.27", default-features = false, features = ["x11"] }

[target.'cfg(windows)'.dependencies]
minifb = "0.27"
