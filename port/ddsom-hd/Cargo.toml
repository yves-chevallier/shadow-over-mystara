[package]
name = "ddsom-hd"
version = "0.1.0"
edition = "2021"
description = "High-definition packs of ddsom: export of the frames and levels, re-indexing of retouched images, loading and HD rendering"

[dependencies]
cps2-gfx = { path = "../cps2-gfx" }
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The `hd-pack` tool (feature `tool`): reads the game data and runs the game to export the frames with their colours.
cps2 = { path = "../cps2", default-features = false, optional = true }
ddsom-data = { path = "../ddsom-data", optional = true }
ddsom-game = { path = "../ddsom-game", default-features = false, optional = true }
extract = { path = "../extract", default-features = false, optional = true }

[features]
default = ["tool"]
tool = ["dep:cps2", "dep:ddsom-data", "dep:ddsom-game", "dep:extract"]

[[bin]]
name = "hd-pack"
required-features = ["tool"]

[lints.clippy]
too_many_arguments = "allow"
