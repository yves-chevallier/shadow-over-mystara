[package]
name = "cps2"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "CPS2 machine: 68000 bus, EEPROM, interrupts, ROM loading (after MAME)"

[dependencies]
m68k = { path = "../m68k" }
cps2-gfx = { path = "../cps2-gfx" }
z80 = { path = "../z80" }
qsound = { path = "../qsound" }
ddsom-sound = { path = "../ddsom-sound" }

[dev-dependencies]
png = "0.17"

[features]
# Log of program ROM reads made by Rust code (outside 68000 instructions): `rom_trace`.
rom-trace = ["m68k/rom-trace"]
