[package]
name = "cps2"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Machine CPS2 : bus 68000, EEPROM, interruptions, chargement des ROMs (d'après MAME)"

[dependencies]
m68k = { path = "../m68k" }
cps2-gfx = { path = "../cps2-gfx" }
z80 = { path = "../z80" }
qsound = { path = "../qsound" }
ddsom-sound = { path = "../ddsom-sound" }

[dev-dependencies]
png = "0.17"

[features]
# Journal des lectures de la ROM programme faites par le code Rust (hors instructions 68000) : `rom_trace`.
rom-trace = ["m68k/rom-trace"]
