[package]
name = "ddsom-rc"
version = "0.1.0"
edition = "2021"
description = "ddsom 68000 code recompiled to Rust (generated at build time from the local ROMs)"
build = "build.rs"

[dependencies]
m68k = { path = "../m68k" }
cps2 = { path = "../cps2" }

[build-dependencies]
recomp = { path = "../recomp" }
cps2 = { path = "../cps2" }

[dev-dependencies]
png = "0.17"
