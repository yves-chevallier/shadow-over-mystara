[package]
name = "ddsom-game"
version = "0.1.0"
edition = "2021"
description = "ddsom game logic rewritten in idiomatic Rust (native routines replacing the 68000 code)"

[dependencies]
m68k = { path = "../m68k" }
cps2 = { path = "../cps2" }
ddsom-rc = { path = "../ddsom-rc" }

[dev-dependencies]
png = "0.17"
cps2-gfx = { path = "../cps2-gfx" }
ddsom-assets = { path = "../ddsom-assets" }

[features]
# Log of the program ROM reads made by the Rust code (examples/rom_reads.rs).
rom-trace = ["cps2/rom-trace"]
# Call stack of the writes to an address (examples/fuzz_couv, FUZZ_SURVEILLE).
watch_writes = []

[[example]]
name = "rom_reads"
required-features = ["rom-trace"]
