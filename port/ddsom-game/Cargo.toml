[package]
name = "ddsom-game"
version = "0.1.0"
edition = "2021"
description = "ddsom game logic rewritten in idiomatic Rust (native routines replacing the 68000 code)"

[dependencies]
cps2 = { path = "../cps2", default-features = false }
ddsom-data = { path = "../ddsom-data" }
# The 68000, the recompiled original code and the emulated Z80: tools only (feature `tools`), never the game.
m68k = { path = "../m68k", optional = true }
ddsom-rc = { path = "../ddsom-rc", optional = true }
# The extraction in memory of the game data from the ROMs of a machine (tools: machines loaded from the ROMs).
extract = { path = "../extract", default-features = false, optional = true }

[dev-dependencies]
extract = { path = "../extract", default-features = false }
png = "0.17"
cps2-gfx = { path = "../cps2-gfx" }
ddsom-assets = { path = "../ddsom-assets" }

[features]
# The game alone (`ddsom` depends on it with `default-features = false`) has no 68000. The tools (examples: validate,
# fuzz_*, coverage...) also need the reference machine and the natives at the original addresses, whose arguments
# and results are in the registers of the original (module `tools`).
default = ["tools"]
tools = ["dep:m68k", "dep:ddsom-rc", "dep:extract", "cps2/m68k", "cps2/z80"]
# Log of the program ROM reads made by the Rust code (examples/rom_reads.rs).
rom-trace = ["cps2/rom-trace"]
# Call stack of the writes to an address (examples/fuzz_couv, FUZZ_SURVEILLE).
watch_writes = []

[[example]]
name = "rom_reads"
required-features = ["rom-trace"]

# Clippy rules switched off for the whole crate (examples included), because they would hurt readability here:
[lints.clippy]
# The state machines dispatch on the state, then test their condition inside the arm, like the original: merging the
# test into a match guard would mix the two levels and make the arm order depend on guards.
collapsible_match = "allow"
# The routines keep the parameters of the original routine (positions, tables, flags) as named arguments; grouping
# them in a struct used by a single function would only hide them.
too_many_arguments = "allow"
