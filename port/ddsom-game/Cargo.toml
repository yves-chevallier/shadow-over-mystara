[package]
name = "ddsom-game"
version = "0.1.0"
edition = "2021"
description = "Logique de jeu de ddsom réécrite en Rust idiomatique (routines natives remplaçant le code 68000)"

[dependencies]
m68k = { path = "../m68k" }
cps2 = { path = "../cps2" }
ddsom-rc = { path = "../ddsom-rc" }

[dev-dependencies]
png = "0.17"
cps2-gfx = { path = "../cps2-gfx" }
ddsom-assets = { path = "../ddsom-assets" }

[features]
# Journal des lectures de la ROM programme par le code Rust (examples/lectures_rom.rs).
rom-trace = ["cps2/rom-trace"]
# Pile d'appels des écritures à une adresse (examples/fuzz_couv, FUZZ_SURVEILLE).
surveille = []

[[example]]
name = "lectures_rom"
required-features = ["rom-trace"]
