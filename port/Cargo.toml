[workspace]
resolver = "2"
members = ["cps2", "cps2-gfx", "ddsom", "ddsom-assets", "ddsom-data", "ddsom-game", "ddsom-hd", "ddsom-rc", "ddsom-sound", "extract", "m68k", "qsound", "recomp", "vrender", "z80"]

[profile.release]
debug = 1

# Recompiled 68000 code (transient, generated: tens of MB): many compilation units and
# no debug info, otherwise LLVM can spend over an hour on the largest one.
[profile.release.package.ddsom-rc]
opt-level = 3
codegen-units = 256
debug = 0
